name: Build participant plugin

on:
  workflow_dispatch:
    inputs:
      recipeJson:
        description: Contents of the versioned participant recipe JSON (pins the source commits)
        required: true
      serverUrl:
        description: Hosted backend origin (https://...)
        required: true
      version:
        description: Participant release version
        required: true
      serverCommit:
        description: Pinned code4me2-server commit
        required: true
      pluginCommit:
        description: Pinned code4me2 commit
        required: true
      runtimeRepository:
        description: Runtime release repository (owner/code4me2-server)
        required: true
      runtimeTag:
        description: Immutable runtime release tag (runtime-vX.Y.Z)
        required: true

jobs:
  # The research proxy is a per-platform PyInstaller bundle; there is no
  # cross-compile. The release's platform list is the native agent platform set
  # declared by the managed runtime release manifest
  # (code4me-managed-runtime-release.json): its `code4me-agent-<os>-<arch>.zip`
  # artifacts are mapped onto the supported proxy matrix and runner labels by
  # scripts/research-proxy-platforms.py (see docs/RESEARCH_PROXY_RELEASE.md).
  prepare-proxy-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pluginCommit }}
      - name: Download managed runtime release manifest
        env:
          GH_TOKEN: ${{ secrets.CODE4ME_RELEASE_TOKEN || github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtimes"
          gh release download "${{ inputs.runtimeTag }}" \
            --repo "${{ inputs.runtimeRepository }}" \
            --pattern 'code4me-managed-runtime-release.json' \
            --dir "$RUNNER_TEMP/runtimes"
      - name: Derive research proxy platform matrix
        id: platforms
        run: |
          python3 scripts/research-proxy-platforms.py \
            "$RUNNER_TEMP/runtimes/code4me-managed-runtime-release.json" \
            --github-output "$GITHUB_OUTPUT"

  # One PyInstaller-capable runner per declared platform. Each job checks out
  # the pinned server contracts (PyInstaller packages the shared `research`
  # modules) and uploads telemetry-acp-proxy/dist/<os>-<arch>/ for the release
  # job to stage. Do not rely on the checked-in dist/ directory: it is ignored
  # by git and absent on a clean runner.
  build-research-proxy:
    needs: prepare-proxy-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-proxy-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pluginCommit }}
          path: code4me2
      - name: Check out pinned server contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.runtimeRepository }}
          ref: ${{ inputs.serverCommit }}
          path: code4me2-server
          token: ${{ secrets.CODE4ME_RELEASE_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked proxy build toolchain
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            -r code4me2-server/packaging/requirements-runtime.lock \
            -r code4me2-server/packaging/requirements-build.lock
          python -m pip install --disable-pip-version-check --no-deps ./code4me2-server
      - name: Build self-contained proxy bundle
        working-directory: code4me2
        shell: bash
        env:
          PYTHON: python
        run: |
          ./gradlew --no-daemon --no-configuration-cache buildResearchProxyBundle \
            "-PresearchProxyPlatforms=${{ matrix.platform }}"
      - name: Verify bundle layout
        working-directory: code4me2
        shell: bash
        run: |
          set -euo pipefail
          bundle="telemetry-acp-proxy/dist/${{ matrix.platform }}"
          test -d "$bundle"
          test -f "$bundle/${{ matrix.executable }}"
      - name: Upload proxy bundle
        uses: actions/upload-artifact@v4
        with:
          name: research-proxy-${{ matrix.platform }}
          path: code4me2/telemetry-acp-proxy/dist/${{ matrix.platform }}
          if-no-files-found: error

  # Negative control: the release's strict staging flags must reject a runner
  # without prebuilt bundles instead of silently packaging proxy source. A clean
  # ubuntu runner has no telemetry-acp-proxy/dist/ directory.
  negative-control-missing-proxy:
    needs: prepare-proxy-matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pluginCommit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Strict staging must fail without proxy bundles
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./gradlew --no-daemon --no-configuration-cache stageResearchProxy \
            "-PresearchProxyPlatforms=${{ needs.prepare-proxy-matrix.outputs.platforms }}" \
            "-PrequireResearchProxyBundles=true" 2>&1 | tee "$RUNNER_TEMP/strict-staging.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "strict staging succeeded without proxy bundles; the release would ship source-only" >&2
            exit 1
          fi
          if ! grep -q "Missing self-contained research proxy bundle" "$RUNNER_TEMP/strict-staging.log"; then
            echo "strict staging failed for an unexpected reason" >&2
            exit 1
          fi

  build:
    needs:
      - prepare-proxy-matrix
      - build-research-proxy
      - negative-control-missing-proxy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pluginCommit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify pinned plugin commit
        run: |
          actual=$(git rev-parse HEAD)
          case "$actual" in
            "${{ inputs.pluginCommit }}"*) ;;
            *) echo "Checked out $actual, expected ${{ inputs.pluginCommit }}" >&2; exit 1 ;;
          esac
      - name: Download pinned native runtime release
        env:
          GH_TOKEN: ${{ secrets.CODE4ME_RELEASE_TOKEN || github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtimes"
          gh release download "${{ inputs.runtimeTag }}" \
            --repo "${{ inputs.runtimeRepository }}" \
            --pattern 'code4me-agent-*.zip' \
            --pattern 'code4me-managed-runtime-release.json' \
            --dir "$RUNNER_TEMP/runtimes"
      - name: Check out release preparation contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.runtimeRepository }}
          ref: ${{ inputs.serverCommit }}
          path: release-server
          token: ${{ secrets.CODE4ME_RELEASE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release preparation dependencies
        run: python3 -m pip install -r release-server/packaging/requirements-runtime.lock
      - name: Prepare the three agent releases from one recipe
        env:
          RELEASE_RECIPE_JSON: ${{ inputs.recipeJson }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ["RUNNER_TEMP"]) / "recipe.json").write_text(os.environ["RELEASE_RECIPE_JSON"])
          PY
          python3 scripts/participant-release.py --server-source release-server/src prepare \
            "$RUNNER_TEMP/recipe.json" --inputs "$RUNNER_TEMP/runtimes" \
            --output "$RUNNER_TEMP/participant-release"
      - name: Verify recipe pins match the requested build
        env:
          EXPECTED_PLUGIN: ${{ inputs.pluginCommit }}
          EXPECTED_SERVER: ${{ inputs.serverCommit }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          recipe = json.loads((Path(os.environ["RUNNER_TEMP"]) / "participant-release/recipe.json").read_text())
          assert recipe["plugin_commit"] == os.environ["EXPECTED_PLUGIN"]
          assert recipe["server_commit"] == os.environ["EXPECTED_SERVER"]
          assert recipe["plugin_version"] == os.environ["EXPECTED_VERSION"]
          PY
      - name: Run plugin tests
        run: ./gradlew --no-daemon test
      - name: Download research proxy bundles
        uses: actions/download-artifact@v4
        with:
          pattern: research-proxy-*
          path: ${{ runner.temp }}/research-proxies
      - name: Stage research proxy bundles into dist/
        shell: bash
        run: |
          set -euo pipefail
          platforms="${{ needs.prepare-proxy-matrix.outputs.platforms }}"
          IFS=',' read -r -a requested <<< "$platforms"
          for platform in "${requested[@]}"; do
            source_dir="$RUNNER_TEMP/research-proxies/research-proxy-$platform"
            if [ ! -d "$source_dir" ]; then
              echo "research proxy artifact for $platform is missing" >&2
              exit 1
            fi
            executable="telemetry-acp-proxy"
            if [ "$platform" = "windows-x64" ]; then
              executable="telemetry-acp-proxy.exe"
            fi
            if [ ! -f "$source_dir/$executable" ]; then
              echo "research proxy artifact for $platform does not contain $executable" >&2
              exit 1
            fi
            if [ "$executable" = "telemetry-acp-proxy" ]; then
              chmod +x "$source_dir/$executable"
            fi
            mkdir -p "telemetry-acp-proxy/dist/$platform"
            cp -R "$source_dir/." "telemetry-acp-proxy/dist/$platform/"
          done
      - name: Build participant ZIP
        env:
          PARTICIPANT_SERVER_URL: ${{ inputs.serverUrl }}
        run: |
          python3 scripts/participant-release.py --server-source release-server/src build \
            "$RUNNER_TEMP/participant-release" --server-url "$PARTICIPANT_SERVER_URL"
      - name: Upload release recipe and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: participant-release-evidence
          path: |
            ${{ runner.temp }}/participant-release/recipe.json
            ${{ runner.temp }}/participant-release/prepared-inputs.json
            ${{ runner.temp }}/participant-release/build-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: code4me-participant-${{ inputs.version }}
          path: build/distributions/*.zip
          if-no-files-found: error

  # Publish the installable plugin ZIP under an immutable plugin-v<version> tag.
  # The installable ZIP already bundles the exact pinned agent archives and the
  # per-platform proxy runtimes staged and verified above. Assets of a published
  # plugin release are never replaced.
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: code4me-participant-${{ inputs.version }}
          path: plugin-assets
      - name: Publish immutable plugin release
        env:
          GH_TOKEN: ${{ secrets.CODE4ME_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag="plugin-v${{ inputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to replace its assets" >&2
            exit 1
          fi
          shopt -s nullglob
          assets=(plugin-assets/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "the participant ZIP artifact is missing" >&2
            exit 1
          fi
          gh release create "$tag" \
            --target "${{ inputs.pluginCommit }}" \
            --title "Code4Me participant plugin ${{ inputs.version }}" \
            "${assets[@]}"
