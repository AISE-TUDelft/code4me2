name: Build participant plugin

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      serverUrl:
        description: Backend origin (localhost is allowed for test ZIPs)
        required: true
        default: http://localhost:8008
      version:
        description: Plugin version
        required: true
        default: 0.0.1-test1
      runtimeRepository:
        description: Runtime release repository (owner/code4me2-server)
        required: true
        default: AISE-TUDelft/code4me2-server
      runtimeRunId:
        description: Successful runtime workflow run ID with the combined artifact
        required: false
      runtimeTag:
        description: Published runtime release tag, if no run ID is given
        required: false
      publishRelease:
        description: Publish plugin ZIP (HTTPS, or localhost HTTP for a prerelease)
        type: boolean
        required: true
        default: false
      fullHostSmoke:
        description: Run the final plugin ZIP smoke test on every supported host
        type: boolean
        required: true
        default: false

jobs:
  # The research proxy is a per-platform PyInstaller bundle; there is no
  # cross-compile. The release's platform list is the native agent platform set
  # declared by the managed runtime release manifest
  # (code4me-managed-runtime-release.json): its `code4me-agent-<os>-<arch>.zip`
  # artifacts are mapped onto the supported proxy matrix and runner labels by
  # scripts/research-proxy-platforms.py (see docs/RESEARCH_PROXY_RELEASE.md).
  prepare-proxy-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      server_commit: ${{ steps.platforms.outputs.server_commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Check managed-only build support
        run: |
          python3 scripts/participant-release.py build --help | grep -q -- '--managed-only-test'
          python3 scripts/verify-participant-artifact.py --help | grep -q -- '--allow-managed-only'
      - name: Validate release inputs
        env:
          PARTICIPANT_SERVER_URL: ${{ inputs.serverUrl }}
          PLUGIN_VERSION: ${{ inputs.version }}
          RUNTIME_RUN_ID: ${{ inputs.runtimeRunId }}
          RUNTIME_TAG: ${{ inputs.runtimeTag }}
        run: |
          set -euo pipefail
          if [ -n "$RUNTIME_RUN_ID" ] && [ -n "$RUNTIME_TAG" ] || [ -z "$RUNTIME_RUN_ID" ] && [ -z "$RUNTIME_TAG" ]; then
            echo "provide exactly one runtime run ID or release tag" >&2; exit 1
          fi
          if [ -n "$RUNTIME_RUN_ID" ] && ! [[ "$RUNTIME_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "runtime run ID must be numeric" >&2; exit 1
          fi
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlsplit

          version = os.environ["PLUGIN_VERSION"]
          origin = urlsplit(os.environ["PARTICIPANT_SERVER_URL"])
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+", version):
              raise SystemExit("test ZIPs require a SemVer prerelease version")
          if (origin.scheme != "http" or origin.hostname not in {"localhost", "127.0.0.1"}
                  or origin.port is None or origin.username or origin.password
                  or origin.path not in {"", "/"} or origin.query or origin.fragment):
              raise SystemExit("the simple managed-only workflow requires a localhost HTTP origin")
          PY
      - name: Download managed runtime release manifest
        env:
          GH_TOKEN: ${{ secrets.CODE4ME_RELEASE_TOKEN || github.token }}
          RUNTIME_RUN_ID: ${{ inputs.runtimeRunId }}
          RUNTIME_TAG: ${{ inputs.runtimeTag }}
          RUNTIME_REPOSITORY: ${{ inputs.runtimeRepository }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtimes"
          if [ -n "$RUNTIME_RUN_ID" ]; then
            gh run download "$RUNTIME_RUN_ID" --repo "$RUNTIME_REPOSITORY" \
              --name code4me-managed-runtime-release --dir "$RUNNER_TEMP/runtimes"
          else
            gh release download "$RUNTIME_TAG" --repo "$RUNTIME_REPOSITORY" \
              --pattern 'code4me-managed-runtime-release.json' --dir "$RUNNER_TEMP/runtimes"
          fi
      - name: Derive research proxy platform matrix
        id: platforms
        run: |
          python3 scripts/research-proxy-platforms.py \
            "$RUNNER_TEMP/runtimes/code4me-managed-runtime-release.json" \
            --github-output "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "runtimes/code4me-managed-runtime-release.json").read_text())
          print("server_commit=" + manifest["server_commit"])
          PY

  # One PyInstaller-capable runner per declared platform. Each job checks out
  # the pinned server contracts (PyInstaller packages the shared `research`
  # modules) and uploads telemetry-acp-proxy/dist/<os>-<arch>/ for the release
  # job to stage. Do not rely on the checked-in dist/ directory: it is ignored
  # by git and absent on a clean runner.
  build-research-proxy:
    needs: prepare-proxy-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-proxy-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: code4me2
      - name: Check out pinned server contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.runtimeRepository }}
          ref: ${{ needs.prepare-proxy-matrix.outputs.server_commit }}
          path: code4me2-server
          token: ${{ secrets.CODE4ME_RELEASE_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked proxy build toolchain
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            -r code4me2-server/packaging/requirements-runtime.lock \
            -r code4me2-server/packaging/requirements-build.lock
          python -m pip install --disable-pip-version-check --no-deps ./code4me2-server
      - name: Build self-contained proxy bundle
        working-directory: code4me2
        shell: bash
        env:
          PYTHON: python
        run: |
          ./gradlew --no-daemon --no-configuration-cache buildResearchProxyBundle \
            "-PresearchProxyPlatforms=${{ matrix.platform }}"
      - name: Verify bundle layout
        working-directory: code4me2
        shell: bash
        run: |
          set -euo pipefail
          bundle="telemetry-acp-proxy/dist/${{ matrix.platform }}"
          test -d "$bundle"
          test -f "$bundle/${{ matrix.executable }}"
          "$bundle/${{ matrix.executable }}" --help | grep -Fq -- '--compat-idempotent-initialize' || {
            echo "frozen proxy for ${{ matrix.platform }} does not support --compat-idempotent-initialize" >&2
            exit 1
          }
      - name: Upload proxy bundle
        uses: actions/upload-artifact@v4
        with:
          name: research-proxy-${{ matrix.platform }}
          path: code4me2/telemetry-acp-proxy/dist/${{ matrix.platform }}
          if-no-files-found: error

  # Negative control: the release's strict staging flags must reject a runner
  # without prebuilt bundles instead of silently packaging proxy source. A clean
  # ubuntu runner has no telemetry-acp-proxy/dist/ directory.
  negative-control-missing-proxy:
    needs: prepare-proxy-matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Strict staging must fail without proxy bundles
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./gradlew --no-daemon --no-configuration-cache stageResearchProxy \
            "-PresearchProxyPlatforms=${{ needs.prepare-proxy-matrix.outputs.platforms }}" \
            "-PrequireResearchProxyBundles=true" 2>&1 | tee "$RUNNER_TEMP/strict-staging.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "strict staging succeeded without proxy bundles; the release would ship source-only" >&2
            exit 1
          fi
          if ! grep -q "Missing self-contained research proxy bundle" "$RUNNER_TEMP/strict-staging.log"; then
            echo "strict staging failed for an unexpected reason" >&2
            exit 1
          fi

  build:
    needs:
      - prepare-proxy-matrix
      - build-research-proxy
      - negative-control-missing-proxy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Download pinned native runtime release
        env:
          GH_TOKEN: ${{ secrets.CODE4ME_RELEASE_TOKEN || github.token }}
          RUNTIME_RUN_ID: ${{ inputs.runtimeRunId }}
          RUNTIME_TAG: ${{ inputs.runtimeTag }}
          RUNTIME_REPOSITORY: ${{ inputs.runtimeRepository }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtimes"
          if [ -n "$RUNTIME_RUN_ID" ]; then
            gh run download "$RUNTIME_RUN_ID" --repo "$RUNTIME_REPOSITORY" \
              --name code4me-managed-runtime-release --dir "$RUNNER_TEMP/runtimes"
          else
            gh release download "$RUNTIME_TAG" --repo "$RUNTIME_REPOSITORY" \
              --pattern 'code4me-agent-*.zip' \
              --pattern 'code4me-managed-runtime-release.json' \
              --dir "$RUNNER_TEMP/runtimes"
          fi
      - name: Check out release preparation contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.runtimeRepository }}
          ref: ${{ needs.prepare-proxy-matrix.outputs.server_commit }}
          path: release-server
          token: ${{ secrets.CODE4ME_RELEASE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release preparation dependencies
        run: python3 -m pip install -r release-server/packaging/requirements-runtime.lock
      - name: Prepare managed agent release from runtime manifest
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          runtime_dir = Path(os.environ["RUNNER_TEMP"]) / "runtimes"
          manifest = runtime_dir / "code4me-managed-runtime-release.json"
          runtime = json.loads(manifest.read_text())
          recipe = {
              "plugin_version": os.environ["PLUGIN_VERSION"],
              "plugin_commit": os.environ["GITHUB_SHA"],
              "server_commit": runtime["server_commit"],
              "runtime": {"manifest": manifest.name, "sha256": hashlib.sha256(manifest.read_bytes()).hexdigest()},
              "agents": [{"framework": "code4me2-agent", "version": runtime["runtime_version"]}],
          }
          (runtime_dir / "recipe.json").write_text(json.dumps(recipe))
          PY
          python3 scripts/participant-release.py --server-source release-server/src prepare \
            "$RUNNER_TEMP/runtimes/recipe.json" --inputs "$RUNNER_TEMP/runtimes" \
            --output "$RUNNER_TEMP/participant-release"
      - name: Run plugin tests
        if: inputs.fullHostSmoke
        run: ./gradlew --no-daemon test
      - name: Download research proxy bundles
        uses: actions/download-artifact@v4
        with:
          pattern: research-proxy-*
          path: ${{ runner.temp }}/research-proxies
      - name: Stage research proxy bundles into dist/
        shell: bash
        run: |
          set -euo pipefail
          platforms="${{ needs.prepare-proxy-matrix.outputs.platforms }}"
          IFS=',' read -r -a requested <<< "$platforms"
          for platform in "${requested[@]}"; do
            source_dir="$RUNNER_TEMP/research-proxies/research-proxy-$platform"
            if [ ! -d "$source_dir" ]; then
              echo "research proxy artifact for $platform is missing" >&2
              exit 1
            fi
            executable="telemetry-acp-proxy"
            if [ "$platform" = "windows-x64" ]; then
              executable="telemetry-acp-proxy.exe"
            fi
            if [ ! -f "$source_dir/$executable" ]; then
              echo "research proxy artifact for $platform does not contain $executable" >&2
              exit 1
            fi
            if [ "$executable" = "telemetry-acp-proxy" ]; then
              chmod +x "$source_dir/$executable"
            fi
            mkdir -p "telemetry-acp-proxy/dist/$platform"
            cp -R "$source_dir/." "telemetry-acp-proxy/dist/$platform/"
          done
      - name: Build participant ZIP
        env:
          PARTICIPANT_SERVER_URL: ${{ inputs.serverUrl }}
        run: |
          python3 scripts/participant-release.py --server-source release-server/src build \
            "$RUNNER_TEMP/participant-release" --server-url "$PARTICIPANT_SERVER_URL" \
            --managed-only-test
      - name: Upload release recipe and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: participant-release-evidence
          path: |
            ${{ runner.temp }}/participant-release/recipe.json
            ${{ runner.temp }}/participant-release/prepared-inputs.json
            ${{ runner.temp }}/participant-release/build-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: code4me-participant-${{ inputs.version }}
          path: build/distributions/*.zip
          if-no-files-found: error

  host-smoke:
    if: inputs.fullHostSmoke
    needs: [prepare-proxy-matrix, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-proxy-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: code4me-participant-${{ inputs.version }}
          path: host-assets
      - name: Prepare Linux display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Verify native managed installer
        shell: bash
        run: |
          bash ./gradlew --no-daemon --no-configuration-cache :test \
            --tests me.code4me.services.agent.ManagedRuntimeInstallerTest \
            --tests me.code4me.research.proxy.PackagedAgentInstallerTest \
            --console=plain
      - name: Install final ZIP and start IntelliJ IDEA
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess, time, urllib.request
          from pathlib import Path

          archives = list(Path("host-assets").glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"expected exactly one participant ZIP, found {archives}")
          gradle = (["cmd.exe", "/d", "/c", "gradlew.bat"] if os.environ["RUNNER_OS"] == "Windows" else ["./gradlew"])
          command = [*gradle, "--no-daemon", "--no-configuration-cache",
                     ":runIdeForUiTests", "-PparticipantHostZip=" + str(archives[0].resolve()),
                     "--console=plain"]
          if os.environ["RUNNER_OS"] == "Linux":
              command = ["xvfb-run", "-a", *command]
          env = dict(os.environ, CODE4ME_PLUGIN_ZIP_SMOKE="1")
          log_path = Path("host-ide.log")
          with log_path.open("w") as log:
              ide = subprocess.Popen(command, env=env, stdout=log, stderr=subprocess.STDOUT)
              try:
                  for _ in range(300):
                      if ide.poll() is not None:
                          log.flush()
                          print(log_path.read_text(errors="replace"))
                          raise RuntimeError(f"IntelliJ exited before robot-server started (exit code {ide.returncode})")
                      try:
                          with urllib.request.urlopen("http://localhost:8082/hello", timeout=2) as response:
                              if response.status == 200:
                                  break
                      except OSError:
                          pass
                      time.sleep(2)
                  else:
                      log.flush()
                      print(log_path.read_text(errors="replace"))
                      raise RuntimeError("IntelliJ robot-server did not start within 10 minutes")
                  subprocess.run([*gradle, "--no-daemon", "--no-configuration-cache",
                                  ":ui-tests:test", "--tests", "ui.PluginZipHostSmokeTest",
                                  "--rerun", "--console=plain"], env=env, check=True)
              finally:
                  ide.terminate()
                  try:
                      ide.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      ide.kill()
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ failure() || cancelled() }}
        with:
          name: code4me-host-smoke-${{ matrix.platform }}
          path: |
            host-ide.log
            ui-tests/build/test-results/test/*.xml
          if-no-files-found: warn

  # Publish the installable plugin ZIP under an immutable plugin-v<version> tag.
  # The installable ZIP already bundles the exact pinned agent archives and the
  # per-platform proxy runtimes staged and verified above. Assets of a published
  # plugin release are never replaced.
  publish:
    if: ${{ always() && !cancelled() && inputs.publishRelease && needs.build.result == 'success' && (needs.host-smoke.result == 'success' || needs.host-smoke.result == 'skipped') }}
    needs: [build, host-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: code4me-participant-${{ inputs.version }}
          path: plugin-assets
      - name: Publish immutable plugin release
        env:
          GH_TOKEN: ${{ secrets.CODE4ME_RELEASE_TOKEN || github.token }}
          PLUGIN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="plugin-v$PLUGIN_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to replace its assets" >&2
            exit 1
          fi
          shopt -s nullglob
          assets=(plugin-assets/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "the participant ZIP artifact is missing" >&2
            exit 1
          fi
          release_options=()
          case "$PLUGIN_VERSION" in *-*) release_options+=(--prerelease) ;; esac
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Code4Me participant plugin $PLUGIN_VERSION" \
            "${release_options[@]}" \
            "${assets[@]}"
