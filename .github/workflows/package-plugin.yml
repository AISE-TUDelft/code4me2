name: Package plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    name: Build ZIP artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build plugin and documentation archives
        run: ./gradlew clean buildPlugin dokkaZip --no-daemon --no-configuration-cache

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: code4me-plugin-${{ github.sha }}
          path: |
            build/distributions/*.zip
            !build/distributions/dokka-documentation-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload documentation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: code4me-documentation-${{ github.sha }}
          path: build/distributions/dokka-documentation-*.zip
          if-no-files-found: error
          retention-days: 7
