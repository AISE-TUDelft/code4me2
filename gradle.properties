# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = me.code4me
pluginName = Code4Me V2
pluginRepositoryUrl = https://github.com/AISE-TUDelft/code4me2
# SemVer format -> https://semver.org
pluginVersion = 0.0.1

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 253
pluginUntilBuild = 253.*

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#configuration-intellij-extension
# IntelliJ IDEA 2025.3 ships as a single unified distribution, so there is no longer an
# IC/IU platformType to pick — the build uses intellijIdea(<version>) instead of create(type, version).
#
# Deliberately NOT on a 2026.x build: starting at 2026.1.5 (build 261.27258.48) and through at
# least 2026.2.2 (262.10315.125), the platform's own `intellij-platform-test-runtime` bundled
# module declares dependencies on two conflicting `it.unimi.dsi.fastutil.*` builds
# (`intellij.libraries.fastutil`, the platform's patched fork, and `fleet.fastutil`, a plain
# upstream copy missing methods the fork adds) — a JetBrains packaging regression, confirmed absent
# on 2025.3.2 (253.30387.90, which declares only `intellij.libraries.fastutil`). It breaks every
# BasePlatformTestCase/LightPlatformTestCase/HeavyPlatformTestCase-based test with a
# NoSuchMethodError, reproduced across the full Gradle 8.13+plugin 2.10.4 through Gradle
# 9.7.1+plugin 2.18.1 tooling range — i.e. it tracks the target IDE version, not our tooling.
platformVersion = 2025.3.2
platformDownloadSources = true
platformDownloadDocs = true

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# com.intellij.ml.llm is JetBrains AI Assistant. The plugin does not compile against it —
# agent runtimes are registered declaratively through ~/.jetbrains/acp.json — but it must be
# present in the runIde sandbox to exercise the native ACP chat surface end-to-end.
platformPlugins = com.intellij.ml.llm:253.30387.186

platformBundledPlugins  = org.intellij.plugins.markdown

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 8.13

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache

# JVM Memory Settings for Gradle Daemon
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m