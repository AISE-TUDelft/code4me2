config {
  // module configuration
  modules {
    // List of available modules
    available = [
      {
        id = "TelemetryAggregator"
        class = "me.code4me.services.modules.aggregators.BaseTelemetryAggregator"
        name = "Telemetry Aggregator"
        type = "aggregator"
        description = "Module for aggregating telemetry data"
        enabled = true
        // Example of submodules
        submodules = [
          {
            id = "editor_context_retrieval"
            class = "me.code4me.services.modules.telemetry.EditorContextRetrievalModule"
            name = "Editor Context Retrieval Module"
            type = "telemetry"
            description = "Retrieves context from the editor"
            enabled = true
          },
          {
            id = "time_since_last_accepted_completion"
            class = "me.code4me.services.modules.telemetry.TimeSinceLastAcceptedCompletion"
            name = "Time Since Last Accepted Completion"
            type = "telemetry"
            description = "Calculates the time since the last accepted completion"
            enabled = true
          },
          {
            id = "time_since_last_shown_completion"
            class = "me.code4me.services.modules.telemetry.TimeSinceLastShownCompletion"
            name = "Time Since Last Shown Completion"
            type = "telemetry"
            description = "Calculates the time since the last shown completion"
            enabled = true
          },
          {
            id = "typing_speed"
            class = "me.code4me.services.modules.telemetry.TypingSpeed"
            name = "Typing Speed"
            type = "telemetry"
            description = "Calculates the typing speed of the user"
            enabled = true
          }
        ]
        // Example of dependencies
        dependencies = [
          {
            moduleId = "editor_context_retrieval"
            isHard = false
          },
          {
            moduleId = "time_since_last_accepted_completion"
            isHard = false
          },
          {
            moduleId = "time_since_last_shown_completion"
            isHard = false
          },
          {
            moduleId = "typing_speed"
            isHard = false
          }
        ]
      },
      {
        id = "contextAggregator"
        class = "me.code4me.services.modules.aggregators.BaseContextAggregator"
        name = "Context Aggregator"
        type = "aggregator"
        description = "Module for aggregating context data"
        enabled = true
        // Example of submodules
        submodules = [
          {
            id = "file_context_retrieval"
            class = "me.code4me.services.modules.context.FileContextRetrievalModule"
            name = "File Context Retrieval Module"
            type = "context"
            description = "Retrieves context from the file"
            enabled = true
          },
          {
            id = "multi_file_context_retrieval"
            class = "me.code4me.services.modules.context.MultiFileContextRetrievalModule"
            name = "Multi File Context Retrieval Module"
            type = "context"
            description = "Retrieves context from multiple files"
            enabled = true
          }
        ]
        // Example of dependencies
        dependencies = [
          {
            moduleId = "file_context_retrieval"
            isHard = true  // This is a hard dependency
          },
          {
            moduleId = "multi_file_context_retrieval"
            isHard = false
          }
        ]
      }
    ]

    // Module categories
    categories = {
      telemetry = {
        path = "me.code4me.services.modules.telemetry"
        description = "Modules for telemetry collection"
      }
      context = {
        path = "me.code4me.services.modules.context"
        description = "Modules for context retrieval"
      }
      aggregators = {
        path = "me.code4me.services.modules.aggregators"
        description = "Modules for data aggregation"
      }
    }
  }
  // Server Settings
  server {
    host = "http://127.0.0.1"
    port = 8008
    contextPath = ""
    timeout = 5000
  }
  // Authentication Settings
  auth {
    google {
      clientId = "67736337656-un249ihklv5i93n033i1v46q12bfv5g2.apps.googleusercontent.com"
    }
  }
}
